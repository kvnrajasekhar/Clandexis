name: Mac Mini deploy

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused release tests
        run: |
          pytest -q \
            tests/test_meta_whatsapp_models.py \
            tests/test_agent_orchestrator_integration.py \
            tests/test_merchant_onboarding_state_machine.py

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: mac-mini

    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          MAC_MINI_SSH_KEY: ${{ secrets.MAC_MINI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MAC_MINI_SSH_KEY" > ~/.ssh/mac-mini_deploy
          chmod 600 ~/.ssh/mac-mini_deploy

      - name: Configure known hosts
        env:
          MAC_MINI_KNOWN_HOSTS: ${{ secrets.MAC_MINI_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$MAC_MINI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Sync source to Mac Mini
        env:
          MAC_MINI_HOST: ${{ secrets.MAC_MINI_HOST }}
          MAC_MINI_USER: ${{ secrets.MAC_MINI_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -p 2211 -i ~/.ssh/mac-mini_deploy -o BatchMode=yes" \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='dashboard/node_modules/' \
            --exclude='dashboard/dist/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='output/' \
            ./ "$MAC_MINI_USER@$MAC_MINI_HOST:~/.local/clandexis/app/"

      - name: Build and restart on Mac Mini
        env:
          MAC_MINI_HOST: ${{ secrets.MAC_MINI_HOST }}
          MAC_MINI_USER: ${{ secrets.MAC_MINI_USER }}
        run: |
          ssh -p 2211 \
            -i ~/.ssh/mac-mini_deploy \
            -o BatchMode=yes \
            "$MAC_MINI_USER@$MAC_MINI_HOST" \
            'set -euo pipefail
            cd ~/.local/clandexis/app

            export PATH=/opt/homebrew/bin:/opt/homebrew/opt/postgresql@17/bin:$PATH

            if [ ! -x .venv/bin/python ]; then
              /opt/homebrew/bin/python3.11 -m venv .venv
            fi

            .venv/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt

            cd dashboard
            npm ci
            npm run build
            cd ..

            APP_PIDS=$(lsof -tiTCP:8080 -sTCP:LISTEN 2>/dev/null || true)
            if [ -n "$APP_PIDS" ]; then
              kill $APP_PIDS
              sleep 3
            fi

            nohup .venv/bin/python -m uvicorn webhook_service.main:app \
              --host 127.0.0.1 --port 8080 \
              >> ~/.local/clandexis/logs/app.log 2>&1 &

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                curl -fsS http://127.0.0.1:8080/health
                exit 0
              fi
              sleep 1
            done

            echo "Mac Mini health check failed" >&2
            exit 1'
